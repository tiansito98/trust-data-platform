name: freshness-canary

# Red de seguridad hosted: verifica que el pipeline (que corre en la VM
# DigitalOcean) haya refrescado los datos hace poco. Si no, este job FALLA y
# GitHub manda email automatico (Settings -> Notifications -> Actions).
# No toca Sixt ni la VM: solo lee bronze.ctrl_extraction_log en Supabase.

on:
  schedule:
    # 2h despues de cada corrida del pipeline (11:00 y 01:00 UTC).
    - cron: "0 13 * * *"   # 08:00 COT, tras la corrida de la manana
    - cron: "0 3 * * *"    # 22:00 COT, tras la corrida de la noche
  workflow_dispatch: {}     # permite correrlo a mano desde la pestaña Actions

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg2-binary>=2.9"
      - name: Chequear frescura del pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/freshness_canary.py --max-age-hours 20
