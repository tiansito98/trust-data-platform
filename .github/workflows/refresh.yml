name: refresh

# SUPERSEDIDO (2026-08-27): el pipeline pesado ahora corre en la VM DigitalOcean
# via systemd timer (1x/dia, 05:00 UTC), porque GitHub-hosted no puede llegar a
# Sixt (IP whitelist) y self-hosted en repo publico es riesgo. Ver deploy/README.md.
#
# Se le QUITO el schedule para no encolar corridas self-hosted sin runner (que
# GitHub cancela y generan ruido). Queda solo el disparo manual por si algun dia
# se vuelve a la ruta de runner self-hosted. NO reactivar el schedule mientras la
# VM sea la que corre el pipeline: se duplicaria.

on:
  workflow_dispatch:
    inputs:
      full_load:
        description: 'Hacer FULL load de bronze (en lugar de incremental). Lento, usar solo si watermark esta corrupto.'
        type: boolean
        default: false
        required: false

concurrency:
  group: trust-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      # Supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # SSH tunnel a Sixt (la llave la escribe run_pipeline.py desde SIXT_SSH_PRIVATE_KEY)
      SIXT_SSH_HOST: ${{ secrets.SIXT_SSH_HOST }}
      SIXT_SSH_PORT: ${{ secrets.SIXT_SSH_PORT }}
      SIXT_SSH_USER: ${{ secrets.SIXT_SSH_USER }}
      SIXT_SSH_PRIVATE_KEY: ${{ secrets.SIXT_SSH_PRIVATE_KEY }}
      SIXT_SSH_KEY_PASSPHRASE: ${{ secrets.SIXT_SSH_KEY_PASSPHRASE }}
      # Redshift Sixt
      SIXT_REDSHIFT_HOST: ${{ secrets.SIXT_REDSHIFT_HOST }}
      SIXT_REDSHIFT_PORT: ${{ secrets.SIXT_REDSHIFT_PORT }}
      SIXT_REDSHIFT_DB: ${{ secrets.SIXT_REDSHIFT_DB }}
      SIXT_REDSHIFT_USER: ${{ secrets.SIXT_REDSHIFT_USER }}
      SIXT_REDSHIFT_PASSWORD: ${{ secrets.SIXT_REDSHIFT_PASSWORD }}
      # Pipeline
      TRUST_MNDT_CODE: ${{ secrets.TRUST_MNDT_CODE }}
      LOCAL_PORT: ${{ secrets.LOCAL_PORT }}
      BRONZE_INITIAL_LOOKBACK_DAYS: ${{ secrets.BRONZE_INITIAL_LOOKBACK_DAYS }}
      BRONZE_PAGE_SIZE: ${{ secrets.BRONZE_PAGE_SIZE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: Run pipeline
        run: |
          python scripts/run_pipeline.py ${{ github.event.inputs.full_load == 'true' && '--full' || '' }}
